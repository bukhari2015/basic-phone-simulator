<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#070a11" />
<title>PhoneLab — iPhone Rainbow Crack</title>
<style>
  :root{
    --bg:#070a11; --panel:rgba(15,21,33,0.88); --line:rgba(120,160,255,0.18);
    --txt:#dbe6f7; --dim:#8291aa; --acc:#4da3ff; --hot:#ff7a2d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--txt);-webkit-font-smoothing:antialiased;
    overscroll-behavior:none; touch-action:none; user-select:none;}
  canvas{display:block; touch-action:none;}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:auto;}

  #header{position:absolute;top:12px;left:14px;}
  #header h1{margin:0;font-size:15px;letter-spacing:.16em;font-weight:800;}
  #header h1 span{color:var(--acc);}
  #header p{margin:2px 0 0;font-size:10px;color:var(--dim);letter-spacing:.04em;}

  #fps{position:absolute;top:12px;right:14px;padding:6px 10px;
    font-family:ui-monospace,monospace;font-size:11px;color:#3ddc9a;
    letter-spacing:.05em;font-weight:600;}
  #fps span{color:var(--dim);}

  #tools{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);
    display:flex;gap:4px;padding:6px;max-width:96vw;flex-wrap:wrap;justify-content:center;}
  #tools button{all:unset;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;gap:2px;padding:8px 9px;border-radius:10px;
    font-size:9px;font-weight:600;color:var(--dim);transition:.15s;
    border:1px solid transparent;min-width:48px;}
  #tools button span{font-size:18px;line-height:1;filter:grayscale(1) opacity(.65);}
  #tools button.active{background:rgba(77,163,255,.16);color:#fff;
    border-color:rgba(77,163,255,.45);}
  #tools button.active span{filter:none;}
  #tools button.all.active{background:rgba(255,122,45,.20);
    border-color:rgba(255,122,45,.55);box-shadow:0 0 16px rgba(255,122,45,.25);}

  #info{position:absolute;left:12px;right:12px;top:50px;padding:12px 14px;
    opacity:0;transform:translateY(-8px);transition:.25s;pointer-events:none;}
  #info.show{opacity:1;transform:none;pointer-events:auto;}
  #info h2{margin:0 0 6px;font-size:13px;letter-spacing:.03em;color:#fff;}
  #info h2::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--acc);margin-right:7px;vertical-align:middle;}
  #info p{margin:0;font-size:12px;line-height:1.55;color:#a9b8d0;}
  #info .heatwrap{margin-top:10px;display:none;}
  #info .heatwrap.on{display:block;}
  #info .heatbar{height:6px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden;}
  #info .heatfill{height:100%;width:0%;border-radius:3px;
    background:linear-gradient(90deg,#ff9a4d,#ff4d4d);transition:width .15s linear;}
  #info small{display:block;margin-top:5px;font-size:10px;color:var(--dim);letter-spacing:.05em;}
  #info small.hot{color:var(--hot);font-weight:700;}

  #bottom{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
    display:flex;align-items:center;gap:8px;padding:8px 10px;max-width:96vw;flex-wrap:wrap;justify-content:center;}
  #bottom label{font-size:10px;color:var(--dim);letter-spacing:.06em;
    display:flex;align-items:center;gap:7px;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:96px;height:4px;
    border-radius:3px;background:linear-gradient(90deg,var(--acc),rgba(255,255,255,.14));
    outline:none;cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;
    border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(77,163,255,.9);}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border:none;border-radius:50%;
    background:#fff;box-shadow:0 0 8px rgba(77,163,255,.9);}
  .btn{all:unset;cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.04em;
    padding:8px 11px;border-radius:9px;color:var(--txt);
    background:rgba(255,255,255,.06);border:1px solid var(--line);transition:.15s;
    white-space:nowrap;}
  .btn:active{background:rgba(77,163,255,.22);}
  .btn.on{background:rgba(255,180,80,.20);border-color:rgba(255,180,80,.6);color:#ffcf9a;}
  .btn.file{position:relative;overflow:hidden;}
  .btn.file input{position:absolute;inset:0;opacity:0;font-size:0;}

  #toast{position:absolute;left:50%;bottom:150px;transform:translate(-50%,10px);
    background:rgba(12,18,30,.96);border:1px solid var(--line);padding:9px 14px;
    border-radius:10px;font-size:12px;color:#dbe6f7;opacity:0;transition:.25s;
    pointer-events:none;max-width:88vw;text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,.6);}
  #toast.show{opacity:1;transform:translate(-50%,0);}

  #labels{position:absolute;inset:0;pointer-events:none;}
  .label{position:absolute;left:0;top:0;font-size:9px;font-weight:700;letter-spacing:.07em;
    color:#bfe0ff;text-transform:uppercase;white-space:nowrap;opacity:0;transition:opacity .3s;
    text-shadow:0 0 6px #000,0 0 2px #000;padding:2px 6px;border-radius:20px;
    background:rgba(10,20,40,.6);border:1px solid rgba(120,180,255,.25);}

  @media (min-width:820px){
    #header{top:18px;left:20px;}
    #header h1{font-size:19px;}
    #header p{font-size:11.5px;}
    #fps{top:18px;right:20px;font-size:12px;padding:7px 12px;}
    #tools{left:20px;bottom:auto;top:50%;transform:translateY(-50%);
      flex-direction:column;gap:6px;padding:8px;max-width:none;flex-wrap:nowrap;}
    #tools button{flex-direction:row;font-size:12.5px;padding:9px 10px;min-width:150px;gap:9px;}
    #tools button span{font-size:15px;width:18px;}
    #info{left:auto;right:20px;top:64px;width:290px;padding:16px;transform:translateY(-8px);}
    #info h2{font-size:14px;}
    #info p{font-size:12.5px;}
    #bottom{gap:14px;padding:11px 16px;flex-wrap:nowrap;}
    input[type=range]{width:170px;}
    #toast{bottom:100px;font-size:12.5px;}
  }
</style>
</head>
<body>
<div id="ui">
  <div id="header">
    <h1>PHONE<span>LAB</span></h1>
    <p>iPhone rainbow crack simulator</p>
  </div>

  <div id="fps" class="panel">FPS <span>—</span></div>

  <div id="tools" class="panel">
    <button data-tool="all" class="all active"><span>⚡</span>ALL</button>
    <button data-tool="inspect"><span>🔍</span>Look</button>
    <button data-tool="heat"><span>🔥</span>Heat</button>
    <button data-tool="lift"><span>🖌️</span>Felt</button>
    <button data-tool="pry"><span>🪛</span>Pry</button>
    <button data-tool="screw"><span>🔧</span>Screw</button>
    <button data-tool="scissors"><span>✂️</span>Scissors</button>
    <button data-tool="knife"><span>🔪</span>Slice</button>
    <button data-tool="hammer"><span>🔨</span>Smash</button>
  </div>

  <aside id="info" class="panel">
    <h2 id="infoTitle">Select a part</h2>
    <p id="infoText">Tap any part with the Look tool to learn what it does.</p>
    <div class="heatwrap" id="heatWrap">
      <div class="heatbar"><div class="heatfill" id="heatFill"></div></div>
      <small id="heatLabel">GLUE 0% SOFTENED</small>
    </div>
  </aside>

  <div id="bottom" class="panel">
    <label>SPLIT <input type="range" id="explode" min="0" max="100" value="0"></label>
    <button class="btn on" id="hcutBtn">H‑CUT</button>
    <button class="btn" id="autoBtn">AUTO</button>
    <button class="btn" id="repairBtn">FIX</button>
    <label class="btn file">VIDEO<input type="file" id="videoFile" accept="video/*"></label>
  </div>

  <div id="toast"></div>
  <div id="labels"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ═══════════════════════════════════════════════════════════
   1. DEVICE DETECTION & QUALITY
   ═══════════════════════════════════════════════════════════ */
const isMobile = /Android|iPhone|iPad|iPod|Mobile|Silk/i.test(navigator.userAgent)
              || (navigator.maxTouchPoints > 1 && innerWidth < 900)
              || innerWidth < 700;

const QUALITY = isMobile ? {
  pixelRatio: 1, antialias: false,
  screenW: 320, screenH: 640, screenFps: 30, segments: 8,
} : {
  pixelRatio: Math.min(devicePixelRatio, 2), antialias: true,
  screenW: 512, screenH: 1024, screenFps: 60, segments: 16,
};

/* ═══════════════════════════════════════════════════════════
   2. RENDERER · SCENE · CAMERA
   ═══════════════════════════════════════════════════════════ */
const renderer = new THREE.WebGLRenderer({
  antialias: QUALITY.antialias,
  powerPreference: 'default',
  failIfMajorPerformanceCaveat: false,
});
renderer.setPixelRatio(QUALITY.pixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070a11);
scene.fog = new THREE.Fog(0x070a11, 18, 40);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 120);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.09;
controls.minDistance = 7;
controls.maxDistance = 24;
controls.rotateSpeed = 0.6;
controls.zoomSpeed = 0.9;
controls.enablePan = false;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_ROTATE };

function framePhone() {
  const aspect = innerWidth / innerHeight;
  const dist = aspect < 0.7 ? 16 : aspect < 1.1 ? 14 : 12.5;
  camera.position.set(0, 0.8, dist);
  controls.target.set(0, 0, 0);
  controls.update();
}
framePhone();

/* ═══════════════════════════════════════════════════════════
   3. LIGHTS
   ═══════════════════════════════════════════════════════════ */
scene.add(new THREE.HemisphereLight(0x9fc0ff, 0x0c1018, 1.1));

const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(6, 9, 8);
scene.add(key);

const rim = new THREE.DirectionalLight(0x4d8dff, 1.8);
rim.position.set(-8, 2, -6);
scene.add(rim);

const fill = new THREE.DirectionalLight(0xff9a4d, 0.9);
fill.position.set(3, -6, 5);
scene.add(fill);

/* ═══════════════════════════════════════════════════════════
   4. FLOOR
   ═══════════════════════════════════════════════════════════ */
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(20, 32),
  new THREE.MeshPhongMaterial({ color: 0x0a0e16, shininess: 20 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -3.62;
scene.add(floor);

const grid = new THREE.GridHelper(40, 40, 0x1b2740, 0x111a29);
grid.position.y = -3.6;
grid.material.transparent = true;
grid.material.opacity = 0.45;
scene.add(grid);

/* ═══════════════════════════════════════════════════════════
   5. SCREEN CANVAS
   ═══════════════════════════════════════════════════════════ */
const SCW = QUALITY.screenW, SCH = QUALITY.screenH;
const screenCanvas = document.createElement('canvas');
screenCanvas.width = SCW;
screenCanvas.height = SCH;
const sctx = screenCanvas.getContext('2d');

const screenTex = new THREE.CanvasTexture(screenCanvas);
screenTex.colorSpace = THREE.SRGBColorSpace;
screenTex.generateMipmaps = false;
screenTex.minFilter = THREE.LinearFilter;
screenTex.magFilter = THREE.LinearFilter;

let videoEl = null;

function drawProcedural(ctx, W, H, t) {
  const hue = (t * 12) % 360;

  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, `hsl(${hue}, 60%, 34%)`);
  g.addColorStop(1, `hsl(${(hue + 140) % 360}, 65%, 16%)`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 3; i++) {
    const x = W * (0.5 + 0.4 * Math.sin(t * 0.5 + i * 2.1));
    const y = H * (0.5 + 0.4 * Math.cos(t * 0.4 + i * 2.7));
    const r = W * 0.42;
    const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, `hsla(${(hue + i * 80) % 360}, 90%, 60%, 0.32)`);
    rg.addColorStop(1, 'hsla(0,0%,0%,0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, 6.283);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  const off = (t * 70) % 40;
  for (let y = -40 + off; y < H; y += 40) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  const bx = W * (0.5 + 0.28 * Math.sin(t * 0.85));
  const by = H * (0.6 + 0.06 * Math.sin(t * 1.7));
  ctx.beginPath();
  ctx.arc(bx, by, W * 0.11, 0, 6.283);
  ctx.fillStyle = `hsla(${(hue + 200) % 360}, 100%, 70%, 0.9)`;
  ctx.fill();

  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.font = `800 ${Math.round(W * 0.09)}px sans-serif`;
  ctx.fillText('SPECTRA', W / 2, H * 0.30);
  ctx.font = `600 ${Math.round(W * 0.038)}px monospace`;
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.fillText('LIVE  •  HD', W / 2, H * 0.35);

  ctx.textAlign = 'left';
  ctx.font = `600 ${Math.round(W * 0.038)}px monospace`;
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  const d = new Date();
  ctx.fillText(
    String(d.getHours()).padStart(2, '0') + ':' +
    String(d.getMinutes()).padStart(2, '0'), W * 0.06, H * 0.05);

  if (Math.sin(t * 3) > 0) {
    ctx.beginPath();
    ctx.arc(W * 0.9, H * 0.04, W * 0.015, 0, 6.283);
    ctx.fillStyle = '#ff4d5e';
    ctx.fill();
  }
}

/* ═══════════════════════════════════════════════════════════
   6. DAMAGE MODEL
   ═══════════════════════════════════════════════════════════ */
const damage = {
  severity: 0,
  cracks: [],
  chunks: [],
};

let scissorsDraft = null;
let hCutMode = true;   // horizontal-only cutting

/* ---------- glass overlay (cracks + chunk outlines) ---------- */
const GCW = 256, GCH = 512;
const glassCanvas = document.createElement('canvas');
glassCanvas.width = GCW;
glassCanvas.height = GCH;
const gctx = glassCanvas.getContext('2d');
const glassTex = new THREE.CanvasTexture(glassCanvas);
glassTex.colorSpace = THREE.SRGBColorSpace;

function renderGlassCracks() {
  gctx.clearRect(0, 0, GCW, GCH);
  gctx.lineCap = 'round';
  gctx.lineJoin = 'round';

  for (const cr of damage.cracks) {
    if (cr.pts.length < 2) continue;
    gctx.beginPath();
    cr.pts.forEach((p, i) =>
      i ? gctx.lineTo(p.x * GCW, p.y * GCH) : gctx.moveTo(p.x * GCW, p.y * GCH));
    gctx.strokeStyle = 'rgba(255,255,255,0.20)';
    gctx.lineWidth = cr.w * 3;
    gctx.stroke();
    gctx.strokeStyle = 'rgba(210,235,255,0.95)';
    gctx.lineWidth = Math.max(1, cr.w);
    gctx.stroke();
  }

  for (const c of damage.chunks) {
    const x = c.x * GCW, y = c.y * GCH;
    const w = c.w * GCW, h = c.h * GCH;
    gctx.strokeStyle = 'rgba(255,255,255,0.35)';
    gctx.lineWidth = 5;
    gctx.strokeRect(x, y, w, h);
    gctx.strokeStyle = 'rgba(230,245,255,1)';
    gctx.lineWidth = 2;
    gctx.strokeRect(x, y, w, h);
  }

  glassTex.needsUpdate = true;
}

/* ═══════════════════════════════════════════════════════════
   6b. iPhone-style rainbow LCD damage
   ═══════════════════════════════════════════════════════════ */
function drawIPhoneRainbow(ctx, c, W, H, time) {
  const x = c.x * W;
  const y = c.y * H;
  const w = c.w * W;
  const h = c.h * H;
  if (w < 2 || h < 2) return;

  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();

  /* 1 — dark base (dead panel) */
  ctx.fillStyle = '#050608';
  ctx.fillRect(x, y, w, h);

  /* 2 — horizontal rainbow bands (the signature iPhone look) */
  const bandCount = 18 + (c.seed % 8);
  const bandH = h / bandCount;
  const scroll = (time * 22 + c.seed * 40) % (bandH * 4);

  for (let i = -2; i < bandCount + 2; i++) {
    const by = y + i * bandH + scroll;
    const rel = i / bandCount;

    /* hue cycles along the band — bright saturated colors */
    const hueA = (c.hue + rel * 240 + time * 30) % 360;
    const hueB = (c.hue + rel * 240 + 120 + time * 30) % 360;

    const bg = ctx.createLinearGradient(x, by, x + w, by);
    bg.addColorStop(0,   `hsl(${hueA}, 100%, 52%)`);
    bg.addColorStop(0.35, `hsl(${(hueA + 40) % 360}, 100%, 60%)`);
    bg.addColorStop(0.65, `hsl(${hueB}, 100%, 55%)`);
    bg.addColorStop(1,   `hsl(${(hueB + 60) % 360}, 100%, 50%)`);

    /* random black gaps between bands (dead rows) */
    const dead = Math.sin(i * 2.7 + c.seed) > 0.55;
    ctx.fillStyle = dead ? 'rgba(0,0,0,0.9)' : bg;
    ctx.fillRect(x, by, w, bandH * 0.92);

    /* thin bright separator line */
    if (!dead && Math.sin(i * 1.3 + c.seed) > 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillRect(x, by - 1, w, 1.5);
    }
  }

  /* 3 — vertical smearing streaks (ribbon cable damage) */
  const streakCount = 4 + Math.floor(c.seed % 4);
  for (let i = 0; i < streakCount; i++) {
    const sx = x + ((Math.sin(c.seed + i * 1.9) + 1) / 2) * w;
    const sw = 2 + Math.random() * 8;
    const grad = ctx.createLinearGradient(sx, y, sx, y + h);
    const hueS = (c.hue + i * 70 + time * 20) % 360;
    grad.addColorStop(0, `hsla(${hueS}, 100%, 70%, 0.0)`);
    grad.addColorStop(0.3, `hsla(${hueS}, 100%, 65%, 0.75)`);
    grad.addColorStop(0.7, `hsla(${(hueS + 180) % 360}, 100%, 65%, 0.65)`);
    grad.addColorStop(1, `hsla(${hueS}, 100%, 70%, 0.0)`);
    ctx.fillStyle = grad;
    ctx.fillRect(sx, y, sw, h);
  }

  /* 4 — flickering brightness pulse */
  const flicker = 0.82 + 0.18 * Math.sin(time * 11 + c.seed * 3);
  ctx.fillStyle = `rgba(255,255,255,${0.06 * flicker})`;
  ctx.fillRect(x, y, w, h);

  /* 5 — black bleed from the cut edges (real LCD leaks dark) */
  const edgeW = Math.min(w, h) * 0.22;
  const eg = ctx.createLinearGradient(x, y, x + edgeW, y);
  eg.addColorStop(0, 'rgba(0,0,0,0.85)');
  eg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = eg;
  ctx.fillRect(x, y, edgeW, h);
  const eg2 = ctx.createLinearGradient(x + w, y, x + w - edgeW, y);
  eg2.addColorStop(0, 'rgba(0,0,0,0.85)');
  eg2.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = eg2;
  ctx.fillRect(x + w - edgeW, y, edgeW, h);

  /* 6 — noise speckles */
  const nCount = Math.min(50, Math.floor(w * h / 200));
  for (let i = 0; i < nCount; i++) {
    const nx = x + Math.random() * w;
    const ny = y + Math.random() * h;
    ctx.fillStyle = Math.random() > 0.5
      ? `rgba(255,255,255,${0.25 + Math.random() * 0.45})`
      : `rgba(0,0,0,${0.3 + Math.random() * 0.5})`;
    ctx.fillRect(nx, ny, 1 + Math.random() * 3, 1 + Math.random() * 2);
  }

  ctx.restore();

  /* cut border on top */
  ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(0,0,0,0.8)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x - 1, y - 1, w + 2, h + 2);
}

function renderScreen(time) {
  const ctx = sctx, W = SCW, H = SCH;

  if (videoEl && videoEl.readyState >= 2 && videoEl.videoWidth) {
    const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
    const s = Math.max(W / vw, H / vh);
    ctx.drawImage(videoEl, (W - vw * s) / 2, (H - vh * s) / 2, vw * s, vh * s);
  } else {
    drawProcedural(ctx, W, H, time);
  }

  for (const c of damage.chunks) drawIPhoneRainbow(ctx, c, W, H, time);

  ctx.lineCap = 'round';
  for (const cr of damage.cracks) {
    if (cr.pts.length < 2) continue;
    ctx.beginPath();
    cr.pts.forEach((p, i) =>
      i ? ctx.lineTo(p.x * W, p.y * H) : ctx.moveTo(p.x * W, p.y * H));
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = cr.w + 3;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(235,246,255,0.92)';
    ctx.lineWidth = cr.w;
    ctx.stroke();
  }

  /* scissors preview */
  if (scissorsDraft) {
    const { x1, y1, x2, y2 } = scissorsDraft;
    const rx = Math.min(x1, x2) * W;
    const ry = Math.min(y1, y2) * H;
    const rw = Math.abs(x2 - x1) * W;
    const rh = Math.abs(y2 - y1) * H;

    ctx.save();
    ctx.fillStyle = 'rgba(255,180,80,0.18)';
    ctx.fillRect(rx, ry, rw, rh);

    ctx.strokeStyle = 'rgba(255,220,140,0.95)';
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 7]);
    ctx.lineDashOffset = -time * 40;
    ctx.strokeRect(rx, ry, rw, rh);
    ctx.setLineDash([]);

    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    const cs = 6;
    ctx.fillRect(rx - cs / 2, ry - cs / 2, cs, cs);
    ctx.fillRect(rx + rw - cs / 2, ry - cs / 2, cs, cs);
    ctx.fillRect(rx - cs / 2, ry + rh - cs / 2, cs, cs);
    ctx.fillRect(rx + rw - cs / 2, ry + rh - cs / 2, cs, cs);
    ctx.restore();
  }

  if (damage.severity > 0.6) {
    const f = Math.min(0.92, (damage.severity - 0.6) * 1.6);
    ctx.fillStyle = `rgba(0,0,0,${f})`;
    ctx.fillRect(0, 0, W, H);
  }

  screenTex.needsUpdate = true;
}

/* ═══════════════════════════════════════════════════════════
   9. DAMAGE ACTIONS
   ═══════════════════════════════════════════════════════════ */
function addCut(uv) {
  const x = uv.x, y = 1 - uv.y;
  if (!currentCut) {
    currentCut = { pts: [{ x, y }], w: 2.4 };
    damage.cracks.push(currentCut);
  } else {
    const last = currentCut.pts[currentCut.pts.length - 1];
    if (Math.hypot(x - last.x, y - last.y) * SCW > 10) {
      currentCut.pts.push({ x, y });
    }
  }
  damage.severity = Math.min(1, damage.severity + 0.012);
}

function finishCut() {
  if (!currentCut) return;
  const pts = currentCut.pts;
  if (pts.length >= 2) {
    const branches = 2 + Math.floor(Math.random() * 2);
    for (let i = 0; i < branches; i++) {
      const base = pts[Math.floor(Math.random() * pts.length)];
      const a = Math.random() * Math.PI * 2;
      const len = 0.05 + Math.random() * 0.12;
      const bp = [{ x: base.x, y: base.y }];
      let cx = base.x, cy = base.y;
      for (let s = 0; s < 3; s++) {
        const aa = a + (Math.random() - 0.5) * 1.2;
        cx += Math.cos(aa) * len / 3;
        cy += Math.sin(aa) * len / 3;
        bp.push({ x: cx, y: cy });
      }
      damage.cracks.push({ pts: bp, w: 1.3 + Math.random() * 1.2 });
    }
    damage.severity = Math.min(1, damage.severity + 0.08);
    renderGlassCracks();
  }
  currentCut = null;
}

function commitScissorsCut() {
  if (!scissorsDraft) return;
  let { x1, y1, x2, y2 } = scissorsDraft;

  /* enforce horizontal-only in H-CUT mode */
  if (hCutMode) {
    const midY = (y1 + y2) / 2;
    const halfH = Math.abs(y2 - y1) / 2;
    y1 = midY - halfH;
    y2 = midY + halfH;
  }

  const cx = Math.min(x1, x2);
  const cy = Math.min(y1, y2);
  const cw = Math.abs(x2 - x1);
  const ch = Math.abs(y2 - y1);

  if (cw < 0.04 || ch < 0.025) {
    scissorsDraft = null;
    return;
  }

  damage.chunks.push({
    x: cx, y: cy, w: cw, h: ch,
    hue: Math.random() * 360,
    seed: Math.random() * 100,
  });

  const rect = [
    { x: cx, y: cy }, { x: cx + cw, y: cy },
    { x: cx + cw, y: cy + ch }, { x: cx, y: cy + ch },
    { x: cx, y: cy },
  ];
  damage.cracks.push({ pts: rect, w: 2.6 });

  const corners = [[cx, cy], [cx + cw, cy], [cx + cw, cy + ch], [cx, cy + ch]];
  corners.forEach(([px, py]) => {
    const a = Math.random() * Math.PI * 2;
    const len = 0.06 + Math.random() * 0.16;
    const pts = [{ x: px, y: py }];
    let ccx = px, ccy = py;
    for (let s = 0; s < 3; s++) {
      const aa = a + (Math.random() - 0.5) * 1.0;
      ccx += Math.cos(aa) * len / 3;
      ccy += Math.sin(aa) * len / 3;
      pts.push({ x: ccx, y: ccy });
    }
    damage.cracks.push({ pts, w: 1.5 + Math.random() * 1.2 });
  });

  damage.severity = Math.min(1, damage.severity + 0.18 + cw * ch * 1.5);
  renderGlassCracks();
  scissorsDraft = null;

  toast('Cut a chunk — iPhone rainbow LCD damage is spreading.');
}

function shatter(uv) {
  const x = uv.x, y = 1 - uv.y;
  const n = 6 + Math.floor(Math.random() * 4);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const len = 0.10 + Math.random() * 0.30;
    const pts = [{ x, y }];
    let cx = x, cy = y;
    const segs = 4 + Math.floor(Math.random() * 3);
    for (let s = 0; s < segs; s++) {
      const aa = a + (Math.random() - 0.5) * 0.9;
      cx += Math.cos(aa) * len / segs;
      cy += Math.sin(aa) * len / segs;
      pts.push({ x: cx, y: cy });
    }
    damage.cracks.push({ pts, w: 1.8 + Math.random() * 2.5 });
  }
  const ringPts = [];
  const R = 0.04 + Math.random() * 0.07;
  for (let i = 0; i <= 20; i++) {
    const a = (i / 20) * Math.PI * 2;
    const rr = R * (0.75 + 0.35 * Math.random());
    ringPts.push({ x: x + Math.cos(a) * rr, y: y + Math.sin(a) * rr * 1.2 });
  }
  damage.cracks.push({ pts: ringPts, w: 2.2 });

  damage.severity = Math.min(1, damage.severity + 0.24);
  renderGlassCracks();
  toast('Smash! The glass cracked.');
}

function repairScreen() {
  damage.severity = 0;
  damage.cracks.length = 0;
  damage.chunks.length = 0;
  scissorsDraft = null;
  renderGlassCracks();
  toast('Screen replaced.');
}

/* ═══════════════════════════════════════════════════════════
   10. TOOL ACTIONS
   ═══════════════════════════════════════════════════════════ */
function detachPart(p, target, rotEuler) {
  p.removed = true;
  p.detachTarget.copy(target);
  if (rotEuler) p.rotTarget.copy(rotEuler);
}

function screwsRemaining() {
  return parts.filter(p => p.id.startsWith('screw') && !p.removed).length;
}

/* ---------- FELT: lift the front glass so the panel is exposed ---------- */
function tryLift(p) {
  if (p.id !== 'frontGlass') {
    toast('The Felt tool lifts the front glass off the screen.');
    return;
  }
  if (p.removed) return toast('The glass is already off — cut the panel now.');
  if (!p.heatLocked) return toast('Heat the front glass first, then use the Felt tool.');

  detachPart(p, new THREE.Vector3(0, 0.5, 6.4), new THREE.Vector3(0.4, -0.55, 0.22));
  toast('Glass lifted off — the bare panel is exposed. Cut it now.');
}

function tryPry(p) {
  if (p.removed) return toast('Already removed.');

  if (p.id === 'backCover') {
    if (!p.heatLocked) return toast('Glue too strong. Heat the back cover first.');
    if (screwsRemaining() > 0)
      return toast(`${screwsRemaining()} screws still holding. Unscrew them first.`);
    detachPart(p, new THREE.Vector3(0, -0.6, -5.5), new THREE.Vector3(-0.5, 0.35, 0.25));
    return toast('Back cover off. Internals exposed.');
  }
  if (p.id === 'frontGlass') {
    tryLift(p);
    return;
  }
  if (p.id === 'display') {
    if (!partById.frontGlass.removed)
      return toast('Lift the front glass off first with the Felt tool.');
    detachPart(p, new THREE.Vector3(0, 0.3, 4.0), new THREE.Vector3(0.2, 0.4, 0));
    return toast('Screen freed.');
  }
  if (p.id === 'battery') {
    if (!partById.backCover.removed)
      return toast('Open the back first.');
    detachPart(p, new THREE.Vector3(0, -1.2, -3.0), new THREE.Vector3(0.4, 0.5, 0.2));
    return toast('Battery lifted out.');
  }
  if (p.id === 'motherboard' || p.id === 'camera' || p.id === 'speaker' || p.id === 'motor') {
    if (!partById.backCover.removed)
      return toast('Open the back cover first to reach that.');
    detachPart(
      p,
      p.base.clone().multiplyScalar(0.4).add(new THREE.Vector3(0, 0, -2.6)),
      new THREE.Vector3(0.3, 0.6, 0.2)
    );
    return toast(`${p.name} lifted out.`);
  }
  toast('That part is held in place. Use the SPLIT slider.');
}

function tryUnscrew(p) {
  if (!p.id.startsWith('screw')) return false;
  if (p.removed) return false;

  p.removed = true;
  p.spin = 24;
  p.detachTarget.set(
    p.base.x * 0.6 + (Math.random() - 0.5) * 1.4,
    p.base.y * 0.5 + (Math.random() - 0.5) * 1.4,
    -3.4
  );
  p.rotTarget.set(Math.random() * 4, Math.random() * 4, Math.random() * 4);

  const left = screwsRemaining();
  toast(left > 0 ? `Screw out. ${left} left.` : 'All screws out — frame is free.');
  return true;
}

/* ═══════════════════════════════════════════════════════════
   11. POINTER / TOUCH EVENTS
   ═══════════════════════════════════════════════════════════ */
const dom = renderer.domElement;
dom.style.touchAction = 'none';

dom.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  setPointer(e.clientX, e.clientY);
  down = { x: e.clientX, y: e.clientY, t: performance.now(), moved: false };

  if (tool === 'knife') {
    const hits = pick();
    const h = hits.find(isScreenHit);
    if (h) {
      cutting = true;
      controls.enabled = false;
      currentCut = null;
      addCut(h.uv);
      try { dom.setPointerCapture(e.pointerId); } catch(_) {}
    }
    return;
  }

  if (tool === 'scissors' || tool === 'all') {
    const hits = pick();
    const h = hits.find(isScreenHit);
    if (h) {
      scissoring = true;
      controls.enabled = false;
      const ux = h.uv.x;
      const uy = 1 - h.uv.y;
      scissorsDraft = { x1: ux, y1: uy, x2: ux, y2: uy };
      try { dom.setPointerCapture(e.pointerId); } catch(_) {}
    }
  }
});

dom.addEventListener('pointermove', e => {
  setPointer(e.clientX, e.clientY);

  if (down && !down.moved && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) {
    down.moved = true;
  }

  if (cutting) {
    const hits = pick();
    const h = hits.find(isScreenHit);
    if (h) addCut(h.uv);
  }

  if (scissoring && scissorsDraft) {
    const hits = pick();
    const h = hits.find(isScreenHit);
    if (h) {
      scissorsDraft.x2 = Math.max(0, Math.min(1, h.uv.x));
      scissorsDraft.y2 = Math.max(0, Math.min(1, 1 - h.uv.y));

      /* in H-CUT mode, lock Y so the rectangle stays horizontal */
      if (hCutMode) {
        scissorsDraft.y1 = scissorsDraft.y1;
        scissorsDraft.y2 = scissorsDraft.y1;
      }
    }
  }
});

function endPointer() {
  if (cutting) {
    cutting = false;
    controls.enabled = true;
    if (currentCut) {
      finishCut();
      toast('Sliced the panel.');
    }
    down = null;
    return;
  }

  if (scissoring) {
    scissoring = false;
    controls.enabled = true;
    if (scissorsDraft) commitScissorsCut();
    down = null;
    return;
  }

  if (down && !down.moved && performance.now() - down.t < 500) {
    handleTap();
  }
  down = null;
}
dom.addEventListener('pointerup', endPointer);
dom.addEventListener('pointercancel', endPointer);

/* ---------- tap router ---------- */
function handleTap() {
  const hits = pick();
  if (!hits.length) {
    if (tool === 'inspect' || tool === 'all') {
      infoEl.classList.remove('show');
      selectedPart = null;
    }
    return;
  }
  const h = hits[0];
  const p = hitPart(h);
  if (!p) return;

  if ((tool === 'heat' || tool === 'all') && p.heatable && !p.removed) {
    heatTarget(p);
    return;
  }

  switch (tool) {
    case 'inspect': showInfo(p); break;

    case 'lift':
      tryLift(p);
      break;

    case 'pry':
      tryPry(p);
      break;

    case 'screw':
      if (!tryUnscrew(p)) toast('Point the screwdriver at a screw.');
      break;

    case 'hammer':
      if (p.id === 'display' || p.id === 'frontGlass') shatter(h.uv);
      else toast('Aim the hammer at the screen.');
      break;

    case 'knife':
      if (p.id === 'display' || p.id === 'frontGlass') {
        addCut(h.uv); finishCut();
        toast('Scored the screen.');
      } else toast('Run the blade across the screen.');
      break;

    case 'scissors':
      if (p.id === 'display' || p.id === 'frontGlass') {
        const ux = h.uv.x, uy = 1 - h.uv.y;
        const s = hCutMode ? 0.06 : 0.10;
        scissorsDraft = {
          x1: Math.max(0, ux - 0.18), y1: Math.max(0, uy - s / 2),
          x2: Math.min(1, ux + 0.18), y2: Math.min(1, uy + s / 2),
        };
        commitScissorsCut();
      } else toast('Tap or drag on the screen to cut a chunk.');
      break;

    case 'heat':
      if (!p.heatable) toast('Only glued panels can be heated.');
      break;

    case 'all': {
      if (p.id.startsWith('screw')) { tryUnscrew(p); return; }

      if (p.id === 'backCover' || p.id === 'frontGlass') {
        if (p.heatLocked) {
          if (p.id === 'frontGlass') tryLift(p);
          else tryPry(p);
          return;
        }
        heatTarget(p);
        return;
      }

      if (p.id === 'display') {
        if (!partById.frontGlass.removed) {
          toast('Lift the front glass off first with the Felt tool.');
          return;
        }
        const ux = h.uv.x, uy = 1 - h.uv.y;
        const s = hCutMode ? 0.06 : 0.10;
        scissorsDraft = {
          x1: Math.max(0, ux - 0.18), y1: Math.max(0, uy - s / 2),
          x2: Math.min(1, ux + 0.18), y2: Math.min(1, uy + s / 2),
        };
        commitScissorsCut();
        return;
      }

      const before = p.removed;
      tryPry(p);
      if (p.removed === before && !infoEl.classList.contains('show')) showInfo(p);
      break;
    }
  }
}

/* ═══════════════════════════════════════════════════════════
   12. HEATING (persistent)
   ═══════════════════════════════════════════════════════════ */
function heatTarget(p) {
  if (p.heatLocked) {
    toast(`${p.name} is already fully heated.`);
    return;
  }
  p.heat = 1;
  p.heatLocked = true;
  p._notified = true;
  for (const m of p.glow) {
    if (m.emissive) m.emissive.setRGB(0.9, 0.30, 0.05);
  }
  toast(`${p.name} heated — glue softened. Use Felt or Pry to lift it.`);
  if (selectedPart === p) updateHeatBar();
}

function updateHeat(dt) {
  if (tool === 'heat' || tool === 'all') {
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(pickables, false);
    let hovered = null;
    if (hits.length) {
      const p = hitPart(hits[0]);
      if (p && p.heatable && !p.removed) hovered = p;
    }
    hoverHeatPart = hovered;
    if (hoverHeatPart) {
      const p = hoverHeatPart;
      if (p.heat < 1) {
        p.heat = Math.min(1, p.heat + dt * 1.6);
        for (const m of p.glow) {
          const g = p.heat;
          if (m.emissive) m.emissive.setRGB(g * 0.9, g * 0.30, g * 0.05);
        }
        if (p.heat >= 1 && !p.heatLocked) {
          p.heatLocked = true;
          toast(`${p.name} glue softened — it stays hot. Lift it off.`);
        }
      }
    }
  } else {
    hoverHeatPart = null;
  }

  const pulse = 0.82 + 0.12 * Math.sin(performance.now() * 0.003);
  for (const p of parts) {
    if (!p.heatable) continue;
    if (p.heatLocked) {
      for (const m of p.glow) {
        if (m.emissive) m.emissive.setRGB(pulse * 0.9, pulse * 0.28, 0.05);
      }
    }
  }

  if (selectedPart && selectedPart.heatable) updateHeatBar();
}

/* ═══════════════════════════════════════════════════════════
   13. FRAME UPDATES
   ═══════════════════════════════════════════════════════════ */
let autoDir = 0;

function updateExplode(dt) {
  if (autoDir !== 0) {
    explodeTarget = THREE.MathUtils.clamp(explodeTarget + autoDir * dt * 0.5, 0, 1);
    slider.value = Math.round(explodeTarget * 100);
    if (explodeTarget <= 0 || explodeTarget >= 1) autoDir = 0;
  }
  explodeCur += (explodeTarget - explodeCur) * (1 - Math.pow(0.002, dt));
}

function updateParts(dt) {
  const k = 1 - Math.pow(0.001, dt);
  for (const p of parts) {
    p.detach.lerp(p.detachTarget, k);
    p.rot.x += (p.rotTarget.x - p.rot.x) * k;
    p.rot.y += (p.rotTarget.y - p.rot.y) * k;
    p.rot.z += (p.rotTarget.z - p.rot.z) * k;

    if (p.spin > 0.02) {
      p.object.rotation.z += p.spin * dt;
      p.spin *= Math.pow(0.08, dt);
    } else if (!p.id.startsWith('screw')) {
      p.object.rotation.set(p.rot.x, p.rot.y, p.rot.z);
    }

    p.object.position.copy(p.base)
      .addScaledVector(p.explode, explodeCur)
      .add(p.detach);
  }
}

function updateLabels() {
  const show = explodeCur > 0.18;
  for (const p of parts) {
    if (!p.el) continue;
    if (!show || p.removed) { p.el.style.opacity = 0; continue; }
    const v = p.object.position.clone().project(camera);
    if (v.z > 1) { p.el.style.opacity = 0; continue; }
    const x = (v.x * 0.5 + 0.5) * innerWidth;
    const y = (-v.y * 0.5 + 0.5) * innerHeight;
    p.el.style.transform = `translate(-50%,-50%) translate(${x}px,${y}px)`;
    p.el.style.opacity = 1;
  }
}

/* ═══════════════════════════════════════════════════════════
   14. MAIN LOOP
   ═══════════════════════════════════════════════════════════ */
let last = performance.now();
let elapsed = 0;
let screenAccum = 0;
let fpsAccum = 0, fpsFrames = 0;
const fpsEl = document.getElementById('fps').querySelector('span');
const screenInterval = 1 / QUALITY.screenFps;

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  elapsed += dt;

  updateExplode(dt);
  updateHeat(dt);
  updateParts(dt);

  screenAccum += dt;
  if (screenAccum >= screenInterval) {
    screenAccum = 0;
    renderScreen(elapsed);
  }

  updateLabels();
  controls.update();
  renderer.render(scene, camera);

  fpsAccum += dt;
  fpsFrames++;
  if (fpsAccum >= 1) {
    fpsEl.textContent = Math.round(fpsFrames / fpsAccum);
    fpsAccum = 0;
    fpsFrames = 0;
  }
}

/* ═══════════════════════════════════════════════════════════
   15. TOOLBAR + BOTTOM UI
   ═══════════════════════════════════════════════════════════ */
const toolButtons = [...document.querySelectorAll('#tools button')];
toolButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    toolButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    tool = btn.dataset.tool;

    const hints = {
      all:      'Drag on the screen to cut a horizontal chunk · tap parts to act.',
      inspect:  'Tap a part to learn what it does.',
      heat:     'Tap or drag over a glued panel — heat locks in.',
      lift:     'Tap the heated front glass with the Felt to lift it off.',
      pry:      'Tap a heated panel to lift it off.',
      screw:    'Tap each screw to unscrew it.',
      scissors: 'Drag a rectangle on the screen — release to cut that chunk.',
      knife:    'Drag across the screen to slice it.',
      hammer:   'Tap the screen to smash it.',
    };
    toast(hints[tool]);
  });
});

const slider = document.getElementById('explode');
slider.addEventListener('input', () => {
  explodeTarget = slider.value / 100;
});

const hcutBtn = document.getElementById('hcutBtn');
hcutBtn.addEventListener('click', () => {
  hCutMode = !hCutMode;
  hcutBtn.classList.toggle('on', hCutMode);
  toast(hCutMode ? 'H-CUT ON — cuts stay horizontal.' : 'H-CUT OFF — free-form cutting.');
});

document.getElementById('autoBtn').addEventListener('click', () => {
  autoDir = explodeTarget > 0.5 ? -1 : 1;
});

document.getElementById('repairBtn').addEventListener('click', repairScreen);

document.getElementById('videoFile').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  if (videoEl) { URL.revokeObjectURL(videoEl.src); videoEl.pause(); }
  videoEl = document.createElement('video');
  videoEl.src = URL.createObjectURL(file);
  videoEl.loop = true;
  videoEl.muted = true;
  videoEl.playsInline = true;
  videoEl.play().catch(() => {});
  toast('Video loaded. Now cut a chunk out.');
});

/* ═══════════════════════════════════════════════════════════
   16. RESIZE + BOOT
   ═══════════════════════════════════════════════════════════ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  framePhone();
});

addEventListener('orientationchange', () => setTimeout(() => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  framePhone();
}, 300));

renderGlassCracks();
showInfo(partById.display);
animate();

setTimeout(() => toast('H‑CUT is on — drag on the screen to cut a horizontal rainbow chunk.'), 1200);
</script>
</body>
</html>
