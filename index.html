<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#070a11" />
<title>PhoneLab — Mobile</title>
<style>
  :root{
    --bg:#070a11; --panel:rgba(15,21,33,0.88); --line:rgba(120,160,255,0.18);
    --txt:#dbe6f7; --dim:#8291aa; --acc:#4da3ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--txt);-webkit-font-smoothing:antialiased;
    overscroll-behavior:none; touch-action:none; user-select:none;}
  canvas{display:block; touch-action:none;}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:auto;}

  /* header */
  #header{position:absolute;top:12px;left:14px;}
  #header h1{margin:0;font-size:15px;letter-spacing:.16em;font-weight:800;}
  #header h1 span{color:var(--acc);}
  #header p{margin:2px 0 0;font-size:10px;color:var(--dim);letter-spacing:.04em;}

  #fps{position:absolute;top:12px;right:14px;padding:6px 10px;
    font-family:ui-monospace,monospace;font-size:11px;color:#3ddc9a;
    letter-spacing:.05em;font-weight:600;}
  #fps span{color:var(--dim);}

  /* tools — horizontal bar at bottom on mobile */
  #tools{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);
    display:flex;gap:4px;padding:6px;max-width:96vw;}
  #tools button{all:unset;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;gap:2px;padding:8px 10px;border-radius:10px;
    font-size:9px;font-weight:600;color:var(--dim);transition:.15s;
    border:1px solid transparent;min-width:52px;}
  #tools button span{font-size:19px;line-height:1;filter:grayscale(1) opacity(.65);}
  #tools button.active{background:rgba(77,163,255,.16);color:#fff;
    border-color:rgba(77,163,255,.45);}
  #tools button.active span{filter:none;}

  /* info card */
  #info{position:absolute;left:12px;right:12px;top:50px;padding:12px 14px;
    opacity:0;transform:translateY(-8px);transition:.25s;pointer-events:none;}
  #info.show{opacity:1;transform:none;pointer-events:auto;}
  #info h2{margin:0 0 6px;font-size:13px;letter-spacing:.03em;color:#fff;}
  #info h2::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--acc);margin-right:7px;vertical-align:middle;}
  #info p{margin:0;font-size:12px;line-height:1.55;color:#a9b8d0;}
  #info .heatwrap{margin-top:10px;display:none;}
  #info .heatwrap.on{display:block;}
  #info .heatbar{height:5px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden;}
  #info .heatfill{height:100%;width:0%;border-radius:3px;
    background:linear-gradient(90deg,#ff9a4d,#ff4d4d);transition:width .1s linear;}
  #info small{display:block;margin-top:5px;font-size:10px;color:var(--dim);letter-spacing:.05em;}

  /* bottom bar */
  #bottom{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
    display:flex;align-items:center;gap:8px;padding:8px 10px;max-width:96vw;}
  #bottom label{font-size:10px;color:var(--dim);letter-spacing:.06em;
    display:flex;align-items:center;gap:7px;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:96px;height:4px;
    border-radius:3px;background:linear-gradient(90deg,var(--acc),rgba(255,255,255,.14));
    outline:none;cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;
    border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(77,163,255,.9);}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border:none;border-radius:50%;
    background:#fff;box-shadow:0 0 8px rgba(77,163,255,.9);}
  .btn{all:unset;cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.04em;
    padding:8px 11px;border-radius:9px;color:var(--txt);
    background:rgba(255,255,255,.06);border:1px solid var(--line);transition:.15s;
    white-space:nowrap;}
  .btn:active{background:rgba(77,163,255,.22);}
  .btn.file{position:relative;overflow:hidden;}
  .btn.file input{position:absolute;inset:0;opacity:0;font-size:0;}

  #toast{position:absolute;left:50%;bottom:150px;transform:translate(-50%,10px);
    background:rgba(12,18,30,.96);border:1px solid var(--line);padding:9px 14px;
    border-radius:10px;font-size:12px;color:#dbe6f7;opacity:0;transition:.25s;
    pointer-events:none;max-width:88vw;text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,.6);}
  #toast.show{opacity:1;transform:translate(-50%,0);}

  #labels{position:absolute;inset:0;pointer-events:none;}
  .label{position:absolute;left:0;top:0;font-size:9px;font-weight:700;letter-spacing:.07em;
    color:#bfe0ff;text-transform:uppercase;white-space:nowrap;opacity:0;transition:opacity .3s;
    text-shadow:0 0 6px #000,0 0 2px #000;padding:2px 6px;border-radius:20px;
    background:rgba(10,20,40,.6);border:1px solid rgba(120,180,255,.25);}

  @media (min-width:820px){
    #header{top:18px;left:20px;}
    #header h1{font-size:19px;}
    #header p{font-size:11.5px;}
    #fps{top:18px;right:20px;font-size:12px;padding:7px 12px;}
    #tools{left:20px;bottom:auto;top:50%;transform:translateY(-50%);
      flex-direction:column;gap:6px;padding:8px;max-width:none;}
    #tools button{flex-direction:row;font-size:12.5px;padding:9px 10px;min-width:132px;gap:9px;}
    #tools button span{font-size:15px;width:18px;}
    #info{left:auto;right:20px;top:64px;width:290px;padding:16px;transform:translateY(-8px);}
    #info h2{font-size:14px;}
    #info p{font-size:12.5px;}
    #bottom{gap:14px;padding:11px 16px;}
    input[type=range]{width:170px;}
    #toast{bottom:100px;font-size:12.5px;}
  }
</style>
</head>
<body>
<div id="ui">
  <div id="header">
    <h1>PHONE<span>LAB</span></h1>
    <p>Teardown simulator</p>
  </div>

  <div id="fps" class="panel">FPS <span>—</span></div>

  <div id="tools" class="panel">
    <button data-tool="inspect" class="active"><span>🔍</span>Inspect</button>
    <button data-tool="heat"><span>🔥</span>Heat</button>
    <button data-tool="pry"><span>🪛</span>Pry</button>
    <button data-tool="screw"><span>🔧</span>Screw</button>
    <button data-tool="knife"><span>🔪</span>Cut</button>
    <button data-tool="hammer"><span>🔨</span>Smash</button>
  </div>

  <aside id="info" class="panel">
    <h2 id="infoTitle">Select a part</h2>
    <p id="infoText">Tap any part with the Inspect tool to learn what it does.</p>
    <div class="heatwrap" id="heatWrap">
      <div class="heatbar"><div class="heatfill" id="heatFill"></div></div>
      <small id="heatLabel">GLUE 0% SOFTENED</small>
    </div>
  </aside>

  <div id="bottom" class="panel">
    <label>SPLIT <input type="range" id="explode" min="0" max="100" value="0"></label>
    <button class="btn" id="autoBtn">AUTO</button>
    <button class="btn" id="repairBtn">FIX</button>
    <label class="btn file">VIDEO<input type="file" id="videoFile" accept="video/*"></label>
  </div>

  <div id="toast"></div>
  <div id="labels"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ═══════════════════════════════════════════════════════════
   1. DEVICE DETECTION & QUALITY
   ═══════════════════════════════════════════════════════════ */
const isMobile = /Android|iPhone|iPad|iPod|Mobile|Silk/i.test(navigator.userAgent)
              || (navigator.maxTouchPoints > 1 && innerWidth < 900)
              || innerWidth < 700;

const QUALITY = isMobile ? {
  pixelRatio: 1,
  antialias: false,
  screenW: 320,
  screenH: 640,
  screenFps: 30,
  segments: 8,
} : {
  pixelRatio: Math.min(devicePixelRatio, 2),
  antialias: true,
  screenW: 512,
  screenH: 1024,
  screenFps: 60,
  segments: 16,
};

/* ═══════════════════════════════════════════════════════════
   2. RENDERER · SCENE · CAMERA
   ═══════════════════════════════════════════════════════════ */
const renderer = new THREE.WebGLRenderer({
  antialias: QUALITY.antialias,
  powerPreference: 'default',
  failIfMajorPerformanceCaveat: false,
});
renderer.setPixelRatio(QUALITY.pixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070a11);
scene.fog = new THREE.Fog(0x070a11, 18, 40);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 120);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.09;
controls.minDistance = 7;
controls.maxDistance = 24;
controls.rotateSpeed = 0.6;
controls.zoomSpeed = 0.9;
controls.enablePan = false;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_ROTATE };

function framePhone() {
  const aspect = innerWidth / innerHeight;
  const dist = aspect < 0.7 ? 16 : aspect < 1.1 ? 14 : 12.5;
  camera.position.set(0, 0.8, dist);
  controls.target.set(0, 0, 0);
  controls.update();
}
framePhone();

/* ═══════════════════════════════════════════════════════════
   3. LIGHTS (no shadows — biggest mobile win)
   ═══════════════════════════════════════════════════════════ */
scene.add(new THREE.HemisphereLight(0x9fc0ff, 0x0c1018, 1.1));

const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(6, 9, 8);
scene.add(key);

const rim = new THREE.DirectionalLight(0x4d8dff, 1.8);
rim.position.set(-8, 2, -6);
scene.add(rim);

const fill = new THREE.DirectionalLight(0xff9a4d, 0.9);
fill.position.set(3, -6, 5);
scene.add(fill);

/* ═══════════════════════════════════════════════════════════
   4. FLOOR
   ═══════════════════════════════════════════════════════════ */
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(20, 32),
  new THREE.MeshPhongMaterial({ color: 0x0a0e16, shininess: 20 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -3.62;
scene.add(floor);

const grid = new THREE.GridHelper(40, 40, 0x1b2740, 0x111a29);
grid.position.y = -3.6;
grid.material.transparent = true;
grid.material.opacity = 0.45;
scene.add(grid);

/* ═══════════════════════════════════════════════════════════
   5. SCREEN CANVAS (the "video")
   ═══════════════════════════════════════════════════════════ */
const SCW = QUALITY.screenW, SCH = QUALITY.screenH;
const screenCanvas = document.createElement('canvas');
screenCanvas.width = SCW;
screenCanvas.height = SCH;
const sctx = screenCanvas.getContext('2d');

const screenTex = new THREE.CanvasTexture(screenCanvas);
screenTex.colorSpace = THREE.SRGBColorSpace;
screenTex.generateMipmaps = false;
screenTex.minFilter = THREE.LinearFilter;
screenTex.magFilter = THREE.LinearFilter;

let videoEl = null;

/* simplified procedural frame — fewer gradients = faster */
function drawProcedural(ctx, W, H, t) {
  const hue = (t * 12) % 360;

  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, `hsl(${hue}, 60%, 34%)`);
  g.addColorStop(1, `hsl(${(hue + 140) % 360}, 65%, 16%)`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  /* soft moving blobs */
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 3; i++) {
    const x = W * (0.5 + 0.4 * Math.sin(t * 0.5 + i * 2.1));
    const y = H * (0.5 + 0.4 * Math.cos(t * 0.4 + i * 2.7));
    const r = W * 0.42;
    const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, `hsla(${(hue + i * 80) % 360}, 90%, 60%, 0.32)`);
    rg.addColorStop(1, 'hsla(0,0%,0%,0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, 6.283);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  /* scan lines */
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  const off = (t * 70) % 40;
  for (let y = -40 + off; y < H; y += 40) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  /* bouncing orb */
  const bx = W * (0.5 + 0.28 * Math.sin(t * 0.85));
  const by = H * (0.6 + 0.06 * Math.sin(t * 1.7));
  ctx.beginPath();
  ctx.arc(bx, by, W * 0.11, 0, 6.283);
  ctx.fillStyle = `hsla(${(hue + 200) % 360}, 100%, 70%, 0.9)`;
  ctx.fill();

  /* title */
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.font = `800 ${Math.round(W * 0.09)}px sans-serif`;
  ctx.fillText('SPECTRA', W / 2, H * 0.30);
  ctx.font = `600 ${Math.round(W * 0.038)}px monospace`;
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.fillText('LIVE  •  HD', W / 2, H * 0.35);

  /* timecode */
  ctx.textAlign = 'left';
  ctx.font = `600 ${Math.round(W * 0.038)}px monospace`;
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  const d = new Date();
  ctx.fillText(
    String(d.getHours()).padStart(2, '0') + ':' +
    String(d.getMinutes()).padStart(2, '0'), W * 0.06, H * 0.05);

  /* rec dot */
  if (Math.sin(t * 3) > 0) {
    ctx.beginPath();
    ctx.arc(W * 0.9, H * 0.04, W * 0.015, 0, 6.283);
    ctx.fillStyle = '#ff4d5e';
    ctx.fill();
  }
}

/* ═══════════════════════════════════════════════════════════
   6. DAMAGE (cracks only — no dead pixels / glitch)
   ═══════════════════════════════════════════════════════════ */
const damage = { severity: 0, cracks: [] };

const GCW = 256, GCH = 512;
const glassCanvas = document.createElement('canvas');
glassCanvas.width = GCW;
glassCanvas.height = GCH;
const gctx = glassCanvas.getContext('2d');
const glassTex = new THREE.CanvasTexture(glassCanvas);
glassTex.colorSpace = THREE.SRGBColorSpace;

function renderGlassCracks() {
  gctx.clearRect(0, 0, GCW, GCH);
  gctx.lineCap = 'round';
  gctx.lineJoin = 'round';
  for (const cr of damage.cracks) {
    if (cr.pts.length < 2) continue;
    gctx.beginPath();
    cr.pts.forEach((p, i) =>
      i ? gctx.lineTo(p.x * GCW, p.y * GCH) : gctx.moveTo(p.x * GCW, p.y * GCH));
    gctx.strokeStyle = 'rgba(255,255,255,0.20)';
    gctx.lineWidth = cr.w * 3;
    gctx.stroke();
    gctx.strokeStyle = 'rgba(210,235,255,0.95)';
    gctx.lineWidth = Math.max(1, cr.w);
    gctx.stroke();
  }
  glassTex.needsUpdate = true;
}

function renderScreen(time) {
  const ctx = sctx, W = SCW, H = SCH;

  if (videoEl && videoEl.readyState >= 2 && videoEl.videoWidth) {
    const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
    const s = Math.max(W / vw, H / vh);
    ctx.drawImage(videoEl, (W - vw * s) / 2, (H - vh * s) / 2, vw * s, vh * s);
  } else {
    drawProcedural(ctx, W, H, time);
  }

  /* cracks drawn into the screen too */
  ctx.lineCap = 'round';
  for (const cr of damage.cracks) {
    if (cr.pts.length < 2) continue;
    ctx.beginPath();
    cr.pts.forEach((p, i) =>
      i ? ctx.lineTo(p.x * W, p.y * H) : ctx.moveTo(p.x * W, p.y * H));
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = cr.w + 3;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(235,246,255,0.92)';
    ctx.lineWidth = cr.w;
    ctx.stroke();
  }

  /* screen fading out as it dies */
  if (damage.severity > 0.6) {
    const f = Math.min(0.92, (damage.severity - 0.6) * 1.6);
    ctx.fillStyle = `rgba(0,0,0,${f})`;
    ctx.fillRect(0, 0, W, H);
  }

  screenTex.needsUpdate = true;
}

/* ═══════════════════════════════════════════════════════════
   7. BUILD THE PHONE (simplified geometry + Phong materials)
   ═══════════════════════════════════════════════════════════ */
const PW = 3.2, PH = 6.4;
const phone = new THREE.Group();
scene.add(phone);

const parts = [];
const partById = {};

function registerPart(o) {
  const p = {
    id: o.id, name: o.name, object: o.object,
    base: o.base.clone(), explode: o.explode.clone(),
    info: o.info, heatable: !!o.heatable, label: o.label !== false,
    heat: 0, removed: false, glow: o.glow || [],
    detach: new THREE.Vector3(), detachTarget: new THREE.Vector3(),
    rot: new THREE.Vector3(), rotTarget: new THREE.Vector3(),
    spin: 0,
  };
  o.object.position.copy(p.base);
  o.object.traverse(c => { c.userData.partId = o.id; });
  phone.add(o.object);
  parts.push(p);
  partById[o.id] = p;
  return p;
}

/* materials — Phong for cheap specular highlights */
const matMetal  = new THREE.MeshPhongMaterial({ color: 0x9aa3b2, specular: 0xffffff, shininess: 90 });
const matDark   = new THREE.MeshPhongMaterial({ color: 0x151922, shininess: 25 });
const matPCB    = new THREE.MeshPhongMaterial({ color: 0x0d4a33, shininess: 15 });
const matChip   = new THREE.MeshPhongMaterial({ color: 0x2a2f3a, specular: 0x8899aa, shininess: 60 });
const matSilver = new THREE.MeshPhongMaterial({ color: 0xc9d3e0, specular: 0xffffff, shininess: 140 });
const matBatt   = new THREE.MeshPhongMaterial({ color: 0x39414f, specular: 0x556677, shininess: 40 });
const matCopper = new THREE.MeshPhongMaterial({ color: 0xb87333, specular: 0xffcc88, shininess: 100 });
const matBack   = new THREE.MeshPhongMaterial({ color: 0x1a2030, specular: 0xffffff, shininess: 80 });

/* ---------- PCB texture (bakes traces + pads, saves meshes) ---------- */
function makePCBTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#0d4a33';
  g.fillRect(0, 0, 256, 256);

  /* traces */
  g.strokeStyle = 'rgba(180,210,120,0.35)';
  g.lineWidth = 2;
  for (let i = 0; i < 14; i++) {
    g.beginPath();
    g.moveTo(Math.random() * 256, Math.random() * 256);
    let x = Math.random() * 256, y = Math.random() * 256;
    for (let s = 0; s < 3; s++) {
      x += (Math.random() - 0.5) * 100;
      y += (Math.random() - 0.5) * 100;
      g.lineTo(x, y);
    }
    g.stroke();
  }

  /* solder pads */
  g.fillStyle = 'rgba(200,220,140,0.55)';
  for (let i = 0; i < 40; i++) {
    const x = Math.random() * 256, y = Math.random() * 256;
    const s = 3 + Math.random() * 4;
    g.fillRect(x, y, s, s);
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ---------- MID-FRAME ---------- */
const frameGroup = new THREE.Group();
const FT = 0.18, FD = 0.24;
function frameBar(w, h, x, y) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, FD), matMetal);
  m.position.set(x, y, 0);
  frameGroup.add(m);
}
frameBar(FT, PH, -PW / 2 + FT / 2, 0);
frameBar(FT, PH,  PW / 2 - FT / 2, 0);
frameBar(PW - FT * 2, FT, 0,  PH / 2 - FT / 2);
frameBar(PW - FT * 2, FT, 0, -PH / 2 + FT / 2);

const plate = new THREE.Mesh(
  new THREE.BoxGeometry(PW - FT * 2, PH - FT * 2, 0.05),
  new THREE.MeshPhongMaterial({ color: 0x272c36, shininess: 30 })
);
plate.position.z = -0.085;
frameGroup.add(plate);

registerPart({
  id: 'frame', name: 'Frame', object: frameGroup,
  base: new THREE.Vector3(0, 0, 0),
  explode: new THREE.Vector3(0, 0, 0),
  info: 'The metal skeleton. Everything bolts onto it, and it helps pull heat away from the chip.'
});

/* ---------- SCREWS (4, single mesh each) ---------- */
[[-1.33, 2.72], [1.33, 2.72], [-1.33, -2.72], [1.33, -2.72]].forEach(([x, y], i) => {
  const s = new THREE.Mesh(
    new THREE.CylinderGeometry(0.08, 0.08, 0.05, QUALITY.segments),
    matSilver
  );
  s.rotation.x = Math.PI / 2;
  registerPart({
    id: 'screw' + i, name: 'Screw', object: s,
    base: new THREE.Vector3(x, y, -0.142),
    explode: new THREE.Vector3(x * 0.3, y * 0.2, -1.5),
    label: false,
    info: 'Holds the frame together. Phones use only a few — glue does most of the work.'
  });
});

/* ---------- BATTERY ---------- */
const battGroup = new THREE.Group();
battGroup.add(new THREE.Mesh(new THREE.BoxGeometry(1.95, 3.1, 0.16), matBatt));
const coil = new THREE.Mesh(
  new THREE.TorusGeometry(0.6, 0.026, 6, 20),
  matCopper
);

/* ---------- pickables ---------- */
const pickables = [];
phone.traverse(o => {
  if (o.isMesh && o.userData.pickable !== false) pickables.push(o);
});

/* ---------- labels ---------- */
const labelWrap = document.getElementById('labels');
parts.forEach(p => {

/* ═══════════════════════════════════════════════════════════
   8. INTERACTION
   ═══════════════════════════════════════════════════════════ */
let tool = 'inspect';
let explodeTarget = 0, explodeCur = 0;

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

let down = null;
let cutting = false;
let currentCut = null;
let hoverHeatPart = null;
let selectedPart = null;

function setPointer(clientX, clientY) {
  pointer.x = (clientX / innerWidth) * 2 - 1;
  pointer.y = -(clientY / innerHeight) * 2 + 1;
}

function pick() {
  raycaster.setFromCamera(pointer, camera);
  return raycaster.intersectObjects(pickables, false);
}

function hitPart(hit) {
  let o = hit.object;
  while (o && !o.userData.partId) o = o.parent;
  return o ? partById[o.userData.partId] : null;
}

function isScreenHit(h) {
  const p = hitPart(h);
  return p && (p.id === 'display' || p.id === 'frontGlass');
}

/* ---------- toast ---------- */
let toastTimer;
const toastEl = document.getElementById('toast');
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

/* ---------- info panel ---------- */
const infoEl = document.getElementById('info');
const infoTitle = document.getElementById('infoTitle');
const infoText = document.getElementById('infoText');
const heatWrap = document.getElementById('heatWrap');
const heatFill = document.getElementById('heatFill');
const heatLabel = document.getElementById('heatLabel');

function showInfo(p) {
  selectedPart = p;
  infoTitle.textContent = p.name;
  infoText.textContent = p.info;
  heatWrap.classList.toggle('on', p.heatable);
  infoEl.classList.add('show');
  updateHeatBar();
}
function updateHeatBar() {
  if (!selectedPart || !selectedPart.heatable) return;
  const v = Math.round(selectedPart.heat * 100);
  heatFill.style.width = v + '%';
  heatLabel.textContent = v >= 100
    ? 'GLUE SOFTENED ✓ — PRY IT OFF'
    : `GLUE ${v}% SOFTENED`;
}

/* ═══════════════════════════════════════════════════════════
   9. DAMAGE ACTIONS
   ═══════════════════════════════════════════════════════════ */
function addCut(uv) {
  const x = uv.x, y = 1 - uv.y;
  if (!currentCut) {
    currentCut = { pts: [{ x, y }], w: 2.4 };
    damage.cracks.push(currentCut);
  } else {
    const last = currentCut.pts[currentCut.pts.length - 1];
    if (Math.hypot(x - last.x, y - last.y) * SCW > 10) {
      currentCut.pts.push({ x, y });
    }
  }
  damage.severity = Math.min(1, damage.severity + 0.012);
}

function finishCut() {
  if (!currentCut) return;
  const pts = currentCut.pts;
  if (pts.length >= 2) {
    /* small branches */
    const branches = 2 + Math.floor(Math.random() * 2);
    for (let i = 0; i < branches; i++) {
      const base = pts[Math.floor(Math.random() * pts.length)];
      const a = Math.random() * Math.PI * 2;
      const len = 0.05 + Math.random() * 0.12;
      const bp = [{ x: base.x, y: base.y }];
      let cx = base.x, cy = base.y;
      for (let s = 0; s < 3; s++) {
        const aa = a + (Math.random() - 0.5) * 1.2;
        cx += Math.cos(aa) * len / 3;
        cy += Math.sin(aa) * len / 3;
        bp.push({ x: cx, y: cy });
      }
      damage.cracks.push({ pts: bp, w: 1.3 + Math.random() * 1.2 });
    }
    damage.severity = Math.min(1, damage.severity + 0.08);
    renderGlassCracks();
  }
  currentCut = null;
}

function shatter(uv) {
  const x = uv.x, y = 1 - uv.y;
  const n = 6 + Math.floor(Math.random() * 4);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const len = 0.10 + Math.random() * 0.30;
    const pts = [{ x, y }];
    let cx = x, cy = y;
    const segs = 4 + Math.floor(Math.random() * 3);
    for (let s = 0; s < segs; s++) {
      const aa = a + (Math.random() - 0.5) * 0.9;
      cx += Math.cos(aa) * len / segs;
      cy += Math.sin(aa) * len / segs;
      pts.push({ x: cx, y: cy });
    }
    damage.cracks.push({ pts, w: 1.8 + Math.random() * 2.5 });
  }
  /* concentric ring */
  const ringPts = [];
  const R = 0.04 + Math.random() * 0.07;
  for (let i = 0; i <= 20; i++) {
    const a = (i / 20) * Math.PI * 2;
    const rr = R * (0.75 + 0.35 * Math.random());
    ringPts.push({ x: x + Math.cos(a) * rr, y: y + Math.sin(a) * rr * 1.2 });
  }
  damage.cracks.push({ pts: ringPts, w: 2.2 });

  damage.severity = Math.min(1, damage.severity + 0.24);
  renderGlassCracks();
  toast('Smash! The glass cracked.');
}

function repairScreen() {
  damage.severity = 0;
  damage.cracks.length = 0;
  renderGlassCracks();
  toast('Screen replaced.');
}

/* ═══════════════════════════════════════════════════════════
   10. TOOL ACTIONS
   ═══════════════════════════════════════════════════════════ */
function detachPart(p, target, rotEuler) {
  p.removed = true;
  p.detachTarget.copy(target);
  if (rotEuler) p.rotTarget.copy(rotEuler);
}

function screwsRemaining() {
  return parts.filter(p => p.id.startsWith('screw') && !p.removed).length;
}

function tryPry(p) {
  if (p.id === 'backCover') {
    if (p.heat < 1) return toast('Glue too strong. Heat the back cover first.');
    if (screwsRemaining() > 0)
      return toast(`${screwsRemaining()} screws still holding. Remove them first.`);
    detachPart(p, new THREE.Vector3(0, -0.6, -5.5), new THREE.Vector3(-0.5, 0.35, 0.25));
    return toast('Back cover off. Internals exposed.');
  }
  if (p.id === 'frontGlass') {
    if (p.heat < 1) return toast('Glue too strong. Heat the front glass first.');
    detachPart(p, new THREE.Vector3(0, 0.4, 6.2), new THREE.Vector3(0.35, -0.5, 0.2));
    return toast('Front glass lifted. Screen underneath.');
  }
  if (p.id === 'display') {
    if (!partById.frontGlass.removed)
      return toast('Front glass is still on top. Remove it first.');
    detachPart(p, new THREE.Vector3(0, 0.3, 4.0), new THREE.Vector3(0.2, 0.4, 0));
    return toast('Screen freed.');
  }
  toast('That part is held in place. Use the SPLIT slider.');
}

function tryUnscrew(p) {
  if (!p.id.startsWith('screw')) return toast('Point the screwdriver at a screw.');
  if (p.removed) return;

  p.removed = true;
  p.spin = 24;
  p.detachTarget.set(
    p.base.x * 0.6 + (Math.random() - 0.5) * 1.4,
    p.base.y * 0.5 + (Math.random() - 0.5) * 1.4,
    -3.4
  );
  p.rotTarget.set(Math.random() * 4, Math.random() * 4, Math.random() * 4);

  const left = screwsRemaining();
  toast(left > 0 ? `Screw out. ${left} left.` : 'All screws out — frame is free.');
}

/* ═══════════════════════════════════════════════════════════
   11. POINTER / TOUCH EVENTS
   ═══════════════════════════════════════════════════════════ */
const dom = renderer.domElement;
dom.style.touchAction = 'none';

dom.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  setPointer(e.clientX, e.clientY);
  down = { x: e.clientX, y: e.clientY, t: performance.now(), moved: false };

  if (tool === 'knife') {
    const hits = pick();
    const h = hits.find(isScreenHit);
    if (h) {
      cutting = true;
      controls.enabled = false;
      currentCut = null;
      addCut(h.uv);
      try { dom.setPointerCapture(e.pointerId); } catch(_) {}
    }
  }
});

dom.addEventListener('pointermove', e => {
  if (!pointer.length) return;
  setPointer(e.clientX, e.clientY);

  if (down && !down.moved && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) {
    down.moved = true;
  }
  if (cutting) {
    const hits = pick();
    const h = hits.find(isScreenHit);
    if (h) addCut(h.uv);
  }
});

function endPointer(e) {
  if (cutting) {
    cutting = false;
    controls.enabled = true;
    if (currentCut) {
      finishCut();
      toast('You cut through the panel.');
    }
    down = null;
    return;
  }
  if (down && !down.moved && performance.now() - down.t < 500) {
    handleTap();
  }
  down = null;
}
dom.addEventListener('pointerup', endPointer);
dom.addEventListener('pointercancel', endPointer);

function handleTap() {
  const hits = pick();
  if (!hits.length) {
    if (tool === 'inspect') { infoEl.classList.remove('show'); selectedPart = null; }
    return;
  }
  const h = hits[0];
  const p = hitPart(h);
  if (!p) return;

  switch (tool) {
    case 'inspect': showInfo(p); break;
    case 'pry':     tryPry(p); break;
    case 'screw':   tryUnscrew(p); break;
    case 'hammer':
      if (p.id === 'display' || p.id === 'frontGlass') shatter(h.uv);
      else toast('Aim the hammer at the screen.');
      break;
    case 'knife':
      if (p.id === 'display' || p.id === 'frontGlass') {
        addCut(h.uv); finishCut();
        toast('Scored the screen.');
      } else toast('Run the blade across the screen.');
      break;
    case 'heat':
      toast('Drag over the back cover or front glass to heat it.');
      break;
  }
}

/* ═══════════════════════════════════════════════════════════
   12. TOOLBAR & BOTTOM UI
   ═══════════════════════════════════════════════════════════ */
const toolButtons = [...document.querySelectorAll('#tools button')];
toolButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    toolButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    tool = btn.dataset.tool;

    const hints = {
      inspect: 'Tap a part to learn what it does.',
      heat:    'Drag over a glued panel to soften the glue.',
      pry:     'Tap a heated panel to lift it off.',
      screw:   'Tap each screw to unscrew it.',
      knife:   'Drag across the screen to slice it.',
      hammer:  'Tap the screen to smash it.',
    };
    toast(hints[tool]);
  });
});

const slider = document.getElementById('explode');
slider.addEventListener('input', () => {
  explodeTarget = slider.value / 100;
});

let autoDir = 0;
document.getElementById('autoBtn').addEventListener('click', () => {
  autoDir = explodeTarget > 0.5 ? -1 : 1;
});

document.getElementById('repairBtn').addEventListener('click', repairScreen);

document.getElementById('videoFile').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  if (videoEl) { URL.revokeObjectURL(videoEl.src); videoEl.pause(); }
  videoEl = document.createElement('video');
  videoEl.src = URL.createObjectURL(file);
  videoEl.loop = true;
  videoEl.muted = true;
  videoEl.playsInline = true;
  videoEl.play().catch(() => {});
  toast('Video loaded. Now try breaking the screen.');
});

/* ═══════════════════════════════════════════════════════════
   13. FRAME UPDATES
   ═══════════════════════════════════════════════════════════ */
function updateExplode(dt) {
  if (autoDir !== 0) {
    explodeTarget = THREE.MathUtils.clamp(explodeTarget + autoDir * dt * 0.5, 0, 1);
    slider.value = Math.round(explodeTarget * 100);
    if (explodeTarget <= 0 || explodeTarget >= 1) autoDir = 0;
  }
  explodeCur += (explodeTarget - explodeCur) * (1 - Math.pow(0.002, dt));
}

function updateHeat(dt) {
  if (tool === 'heat') {
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(pickables, false);
    let hovered = null;
    if (hits.length) {
      const p = hitPart(hits[0]);
      if (p && p.heatable && !p.removed) hovered = p;
    }
    hoverHeatPart = hovered;
  } else {
    hoverHeatPart = null;
  }

  for (const p of parts) {
    if (!p.heatable) continue;
    if (p === hoverHeatPart) {
      p.heat = Math.min(1, p.heat + dt * 0.6);
      if (p.heat >= 1 && !p._notified) {
        p._notified = true;
        toast(`${p.name} glue softened — pry it off.`);
      }
    } else if (p.heat > 0) {
      p.heat = Math.max(0, p.heat - dt * 0.15);
      if (p.heat < 1) p._notified = false;
    }
    const g = p.heat;
    for (const m of p.glow) {
      if (m.emissive) m.emissive.setRGB(g * 0.8, g * 0.25, g * 0.03);
    }
  }
  if (selectedPart && selectedPart.heatable) updateHeatBar();
}

function updateParts(dt) {
  const k = 1 - Math.pow(0.001, dt);
  for (const p of parts) {
    p.detach.lerp(p.detachTarget, k);
    p.rot.x += (p.rotTarget.x - p.rot.x) * k;
    p.rot.y += (p.rotTarget.y - p.rot.y) * k;
    p.rot.z += (p.rotTarget.z - p.rot.z) * k;

    if (p.spin > 0.02) {
      p.object.rotation.z += p.spin * dt;
      p.spin *= Math.pow(0.08, dt);
    } else if (!p.id.startsWith('screw')) {
      p.object.rotation.set(p.rot.x, p.rot.y, p.rot.z);
    }

    p.object.position.copy(p.base)
      .addScaledVector(p.explode, explodeCur)
      .add(p.detach);
  }
}

function updateLabels() {
  const show = explodeCur > 0.18;
  for (const p of parts) {
    if (!p.el) continue;
    if (!show || p.removed) { p.el.style.opacity = 0; continue; }
    const v = p.object.position.clone().project(camera);
    if (v.z > 1) { p.el.style.opacity = 0; continue; }
    const x = (v.x * 0.5 + 0.5) * innerWidth;
    const y = (-v.y * 0.5 + 0.5) * innerHeight;
    p.el.style.transform = `translate(-50%,-50%) translate(${x}px,${y}px)`;
    p.el.style.opacity = 1;
  }
}

/* ═══════════════════════════════════════════════════════════
   14. MAIN LOOP (with mobile frame-skip for screen redraw)
   ═══════════════════════════════════════════════════════════ */
let last = performance.now();
let elapsed = 0;
let screenAccum = 0;
let fpsAccum = 0, fpsFrames = 0;
const fpsEl = document.getElementById('fps').querySelector('span');
const screenInterval = 1 / QUALITY.screenFps;

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  elapsed += dt;

  updateExplode(dt);
  updateHeat(dt);
  updateParts(dt);

  /* throttle screen canvas redraw */
  screenAccum += dt;
  if (screenAccum >= screenInterval) {
    screenAccum = 0;
    renderScreen(elapsed);
  }

  updateLabels();

  controls.update();
  renderer.render(scene, camera);

  /* fps counter */
  fpsAccum += dt;
  fpsFrames++;
  if (fpsAccum >= 1) {
    fpsEl.textContent = Math.round(fpsFrames / fpsAccum);
    fpsAccum = 0;
    fpsFrames = 0;
  }
}

/* ═══════════════════════════════════════════════════════════
   15. RESIZE + BOOT
   ═══════════════════════════════════════════════════════════ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  framePhone();
});

addEventListener('orientationchange', () => setTimeout(() => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  framePhone();
}, 300));

renderGlassCracks();
showInfo(partById.display);
animate();

setTimeout(() => toast('Tip: drag the SPLIT slider to take it apart.'), 1400);
</script>
